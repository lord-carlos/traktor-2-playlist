# Example configuration file for Traktor Playlist Manager
# Copy this file to config.ini and adjust the values to your needs

[logging]
# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = INFO

[jellyfin]
# Jellyfin server URL
server_url = http://your-jellyfin-server-url

# API key for Jellyfin (generate one in your Jellyfin dashboard)
api_key = your-api-key

# User ID for Jellyfin (can be found in the URL when browsing as a user)
user_id = your-user-id

# Prefix to remove from Jellyfin file paths
remove_path_prefix = /mnt/music/

# Prefix to add to local file paths
add_path_prefix = ~/Music/

# Path to save the .m3u playlist file
playlist_name = ~/Music/playlists/Favorites.m3u

[traktor]
# Path to Traktor's collection.nml file (optional, will auto-detect if not specified)
collection_path = 

# Directory to write exported playlist files (default: ~/Music)
output_dir = ~/Music